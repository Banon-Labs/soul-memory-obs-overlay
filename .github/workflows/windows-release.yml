name: windows-release

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag name to release (example: v0.1.0)"
        required: true
        type: string
      draft:
        description: "Create as draft release"
        required: false
        default: false
        type: boolean
      allow_self_signed:
        description: "Allow self-signed cert status for signing (testing only)"
        required: false
        default: false
        type: boolean
      runner_labels_json:
        description: "JSON array for runs-on labels (example: [\"self-hosted\",\"windows\",\"x64\",\"defender-enabled\"])"
        required: false
        default: '["windows-latest"]'
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  build-windows:
    runs-on: ${{ github.event_name == 'workflow_dispatch' && fromJson(inputs.runner_labels_json) || fromJson('["windows-latest"]') }}
    steps:
      - name: Show runner selection
        shell: pwsh
        run: |
          $selected = @'
          ${{ github.event_name == 'workflow_dispatch' && inputs.runner_labels_json || '["windows-latest"]' }}
          '@
          $selected = $selected.Trim()
          Write-Host "Selected runner labels: $selected"
          Write-Host "Runner name: $env:RUNNER_NAME"
          Write-Host "Runner OS/arch: $env:RUNNER_OS / $env:RUNNER_ARCH"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Prefer Git Bash over WSL bash
        shell: pwsh
        run: |
          $gitBin = "C:/Program Files/Git/bin"
          $gitUsrBin = "C:/Program Files/Git/usr/bin"
          if (-not (Test-Path "$gitBin/bash.exe")) {
            throw "Git Bash not found at $gitBin/bash.exe"
          }

          $gitBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          if (Test-Path "$gitUsrBin/bash.exe") {
            $gitUsrBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

          Write-Host "Queued Git Bash directories in PATH for subsequent steps"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install OBS Studio build dependency
        shell: pwsh
        run: |
          $obsDll = Get-ChildItem "C:/Program Files/obs-studio" -Recurse -Filter obs.dll -ErrorAction SilentlyContinue | Select-Object -First 1
          $frontendDll = Get-ChildItem "C:/Program Files/obs-studio" -Recurse -Filter obs-frontend-api.dll -ErrorAction SilentlyContinue | Select-Object -First 1

          if (-not $obsDll -or -not $frontendDll) {
            $obsZipUrl = "https://github.com/obsproject/obs-studio/releases/download/32.1.0/OBS-Studio-32.1.0-Windows-x64.zip"
            $obsZipPath = Join-Path $env:RUNNER_TEMP "obs-runtime.zip"
            $obsExtractRoot = Join-Path $env:RUNNER_TEMP "obs-runtime"

            Write-Host "OBS not found under Program Files; downloading portable runtime from $obsZipUrl"
            Invoke-WebRequest -Uri $obsZipUrl -OutFile $obsZipPath

            if (Test-Path $obsExtractRoot) {
              Remove-Item -Path $obsExtractRoot -Recurse -Force
            }

            Expand-Archive -Path $obsZipPath -DestinationPath $obsExtractRoot -Force
            $obsDll = Get-ChildItem $obsExtractRoot -Recurse -Filter obs.dll -ErrorAction SilentlyContinue | Select-Object -First 1
            $frontendDll = Get-ChildItem $obsExtractRoot -Recurse -Filter obs-frontend-api.dll -ErrorAction SilentlyContinue | Select-Object -First 1
          }

          if (-not $obsDll -or -not $frontendDll) {
            throw "Could not find OBS runtime DLLs in Program Files or downloaded portable package"
          }

          Write-Host "Using OBS runtime DLLs from: $($obsDll.DirectoryName)"

          function New-ImportLib {
            param(
              [string]$DllPath,
              [string]$LibName,
              [string]$OutDir,
              [string]$DumpbinExe,
              [string]$LibExe
            )
            $defPath = Join-Path $OutDir "$LibName.def"
            $libPath = Join-Path $OutDir "$LibName.lib"

            $dump = & $DumpbinExe /exports $DllPath
            if ($LASTEXITCODE -ne 0) {
              throw "dumpbin failed for $DllPath"
            }

            "LIBRARY $LibName" | Out-File -FilePath $defPath -Encoding ascii
            "EXPORTS" | Out-File -FilePath $defPath -Append -Encoding ascii
            foreach ($line in $dump) {
              if ($line -match '^\s+\d+\s+[0-9A-F]+\s+[0-9A-F]+\s+(\S+)$') {
                $Matches[1] | Out-File -FilePath $defPath -Append -Encoding ascii
              }
            }

            & $LibExe /def:$defPath /out:$libPath /machine:x64
            if ($LASTEXITCODE -ne 0) {
              throw "lib.exe failed generating $libPath"
            }
          }

          $toolDir = Get-ChildItem "C:/Program Files/Microsoft Visual Studio/2022" -Recurse -Directory -Filter Hostx64 -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $toolDir) {
            throw "Visual Studio tool directory not found"
          }
          $binDir = Join-Path $toolDir.FullName "x64"
          $dumpbinExe = Join-Path $binDir "dumpbin.exe"
          $libExe = Join-Path $binDir "lib.exe"
          if (-not (Test-Path $dumpbinExe) -or -not (Test-Path $libExe)) {
            throw "dumpbin.exe or lib.exe not found in Visual Studio toolchain"
          }

          $importDir = Join-Path $env:RUNNER_TEMP "obs-import-libs"
          New-Item -ItemType Directory -Path $importDir -Force | Out-Null

          New-ImportLib -DllPath $obsDll.FullName -LibName "obs" -OutDir $importDir -DumpbinExe $dumpbinExe -LibExe $libExe
          New-ImportLib -DllPath $frontendDll.FullName -LibName "obs-frontend-api" -OutDir $importDir -DumpbinExe $dumpbinExe -LibExe $libExe

          Write-Host "Generated import libs in: $importDir"
          "LIB=$importDir;$env:LIB" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run tests
        if: github.event_name != 'workflow_dispatch'
        run: cargo test

      - name: Build plugin and helper
        run: |
          cargo build -p overlay-plugin --target x86_64-pc-windows-msvc --release
          cargo build -p overlay-helper --target x86_64-pc-windows-msvc --release

      - name: Package installer
        shell: pwsh
        run: |
          function Resolve-Makensis {
            $programFilesX86 = ${env:ProgramFiles(x86)}
            $programFiles = $env:ProgramFiles

            $candidates = @(
              (Join-Path $programFilesX86 "NSIS/Bin/makensis.exe"),
              (Join-Path $programFilesX86 "NSIS/makensis.exe"),
              (Join-Path $programFiles "NSIS/Bin/makensis.exe"),
              (Join-Path $programFiles "NSIS/makensis.exe"),
              "$env:ChocolateyInstall/bin/makensis.exe"
            )

            foreach ($candidate in $candidates) {
              if ($candidate -and (Test-Path $candidate)) {
                return (Resolve-Path $candidate).Path
              }
            }

            $command = Get-Command makensis -ErrorAction SilentlyContinue
            if ($command) {
              return $command.Source
            }

            $recursiveRoot = Join-Path $programFilesX86 "NSIS"
            $recursive = Get-ChildItem $recursiveRoot -Recurse -Filter makensis.exe -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($recursive) {
              return $recursive.FullName
            }

            return $null
          }

          $makensisExe = Resolve-Makensis
          if (-not $makensisExe) {
            choco install nsis -y
            $makensisExe = Resolve-Makensis
          }

          if (-not $makensisExe) {
            throw "makensis (NSIS) is not available on this runner after NSIS installation"
          }

          $installerScript = Join-Path $env:GITHUB_WORKSPACE "installer/overlay-installer.nsi"
          if (-not (Test-Path $installerScript)) {
            throw "Installer script not found at $installerScript"
          }

          $expectedOutDir = Join-Path $env:GITHUB_WORKSPACE "target/x86_64-pc-windows-msvc/release"
          New-Item -ItemType Directory -Path $expectedOutDir -Force | Out-Null

          $expectedPlugin = Join-Path $expectedOutDir "overlay_plugin.dll"
          if (-not (Test-Path $expectedPlugin)) {
            $pluginCandidate = Get-ChildItem (Join-Path $env:GITHUB_WORKSPACE "target") -Recurse -File -Filter "*.dll" -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -eq "overlay_plugin.dll" -or $_.Name -eq "overlay-plugin.dll" } |
              Select-Object -First 1
            if (-not $pluginCandidate) {
              $nearbyDlls = Get-ChildItem (Join-Path $env:GITHUB_WORKSPACE "target") -Recurse -File -Filter "*overlay*.dll" -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
              throw "overlay plugin DLL not found in target tree. Nearby candidates: $($nearbyDlls -join '; ')"
            }
            Copy-Item $pluginCandidate.FullName $expectedPlugin -Force
          }

          $expectedHelper = Join-Path $expectedOutDir "overlay-helper.exe"
          if (-not (Test-Path $expectedHelper)) {
            $helperCandidate = Get-ChildItem (Join-Path $env:GITHUB_WORKSPACE "target") -Recurse -File -Filter "overlay-helper.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $helperCandidate) {
              throw "overlay-helper.exe not found in target tree"
            }
            Copy-Item $helperCandidate.FullName $expectedHelper -Force
          }

          $stagingDir = Join-Path $env:GITHUB_WORKSPACE "installer/staging"
          New-Item -ItemType Directory -Path $stagingDir -Force | Out-Null

          Copy-Item $expectedPlugin (Join-Path $stagingDir "overlay_plugin.dll") -Force
          Copy-Item $expectedHelper (Join-Path $stagingDir "overlay-helper.exe") -Force
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE "crates/overlay-plugin/data/config/overlay.toml") (Join-Path $stagingDir "overlay.toml") -Force
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE "crates/overlay-plugin/data/locale/en-US.ini") (Join-Path $stagingDir "en-US.ini") -Force

          Push-Location $env:GITHUB_WORKSPACE
          try {
            if (-not (Test-Path $expectedPlugin)) {
              throw "Expected plugin DLL still missing at $expectedPlugin"
            }
            if (-not (Test-Path $expectedHelper)) {
              throw "Expected helper EXE still missing at $expectedHelper"
            }
            if (-not (Test-Path (Join-Path $stagingDir "overlay_plugin.dll"))) {
              throw "Staged plugin DLL missing in $stagingDir"
            }
            if (-not (Test-Path (Join-Path $stagingDir "overlay-helper.exe"))) {
              throw "Staged helper EXE missing in $stagingDir"
            }
            if (-not (Test-Path (Join-Path $stagingDir "overlay.toml"))) {
              throw "Staged overlay.toml missing in $stagingDir"
            }
            if (-not (Test-Path (Join-Path $stagingDir "en-US.ini"))) {
              throw "Staged en-US.ini missing in $stagingDir"
            }

            $projectRootForNsis = $env:GITHUB_WORKSPACE
            & $makensisExe "/DPROJECT_ROOT=$projectRootForNsis" "installer/overlay-installer.nsi"
          }
          finally {
            Pop-Location
          }

      - name: Prepare release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-assets -Force | Out-Null
          Copy-Item "target/x86_64-pc-windows-msvc/release/overlay_plugin.dll" "release-assets/overlay_plugin.dll" -Force
          Copy-Item "target/x86_64-pc-windows-msvc/release/overlay-helper.exe" "release-assets/overlay-helper.exe" -Force
          Copy-Item "crates/overlay-plugin/data/config/overlay.toml" "release-assets/overlay.toml" -Force
          Copy-Item "crates/overlay-plugin/data/locale/en-US.ini" "release-assets/en-US.ini" -Force
          Copy-Item "QUICKSTART.md" "release-assets/QUICKSTART.md" -Force
          Copy-Item "INSTALL_FIRST.txt" "release-assets/INSTALL_FIRST.txt" -Force
          $installerExe = Get-ChildItem $env:GITHUB_WORKSPACE -Recurse -File -Filter "SoulMemoryOverlay-*-setup.exe" -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $installerExe) {
            throw "Installer EXE not found after NSIS packaging"
          }
          Copy-Item $installerExe.FullName "release-assets/SoulMemoryOverlay-setup.exe" -Force

      - name: Resolve signing configuration
        id: signing_config
        shell: pwsh
        env:
          WINDOWS_CODESIGN_PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
          WINDOWS_CODESIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PFX_PASSWORD }}
          WINDOWS_CODESIGN_ALLOW_SELF_SIGNED: ${{ vars.WINDOWS_CODESIGN_ALLOW_SELF_SIGNED }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          WINDOWS_TRUSTED_SIGNING_ENDPOINT: ${{ vars.WINDOWS_TRUSTED_SIGNING_ENDPOINT }}
          WINDOWS_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ vars.WINDOWS_TRUSTED_SIGNING_ACCOUNT_NAME }}
          WINDOWS_TRUSTED_SIGNING_CERT_PROFILE_NAME: ${{ vars.WINDOWS_TRUSTED_SIGNING_CERT_PROFILE_NAME }}
        run: |
          $releaseContext = "${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}" -eq "true"
          $allowSelfSigned = -not $releaseContext
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $allowSelfSigned = "${{ inputs.allow_self_signed }}" -eq "true"
          }
          if (-not [string]::IsNullOrWhiteSpace($env:WINDOWS_CODESIGN_ALLOW_SELF_SIGNED)) {
            $allowSelfSigned = $env:WINDOWS_CODESIGN_ALLOW_SELF_SIGNED -eq "true"
          }

          $managedValues = [ordered]@{
            AZURE_CLIENT_ID = $env:AZURE_CLIENT_ID
            AZURE_TENANT_ID = $env:AZURE_TENANT_ID
            AZURE_SUBSCRIPTION_ID = $env:AZURE_SUBSCRIPTION_ID
            WINDOWS_TRUSTED_SIGNING_ENDPOINT = $env:WINDOWS_TRUSTED_SIGNING_ENDPOINT
            WINDOWS_TRUSTED_SIGNING_ACCOUNT_NAME = $env:WINDOWS_TRUSTED_SIGNING_ACCOUNT_NAME
            WINDOWS_TRUSTED_SIGNING_CERT_PROFILE_NAME = $env:WINDOWS_TRUSTED_SIGNING_CERT_PROFILE_NAME
          }

          $configuredManagedKeys = @(
            $managedValues.GetEnumerator() |
              Where-Object { -not [string]::IsNullOrWhiteSpace([string]$_.Value) } |
              ForEach-Object { $_.Key }
          )
          $requiredManagedKeys = @($managedValues.Keys)
          $hasManaged = $configuredManagedKeys.Count -eq $requiredManagedKeys.Count
          $hasAnyManaged = $configuredManagedKeys.Count -gt 0

          if ($hasAnyManaged -and -not $hasManaged) {
            $missingManaged = @($requiredManagedKeys | Where-Object { $configuredManagedKeys -notcontains $_ })
            throw "Managed trusted-signing configuration is incomplete. Missing: $($missingManaged -join ', ')"
          }

          $hasPfx = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CODESIGN_PFX_BASE64) -and -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CODESIGN_PFX_PASSWORD)
          if (-not $hasManaged -and -not $hasPfx) {
            throw "No signing configuration found. Configure managed trusted-signing settings or PFX signing secrets."
          }

          $signingMode = if ($hasManaged) { "managed" } else { "pfx" }

          Write-Host "Signing mode: $signingMode"
          Write-Host "Release context: $releaseContext"
          Write-Host "Self-signed allowance enabled: $allowSelfSigned"

          "signing_mode=$signingMode" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "release_context=$($releaseContext.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "allow_self_signed=$($allowSelfSigned.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Azure login (managed trusted-signing)
        if: steps.signing_config.outputs.signing_mode == 'managed'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign binaries with Azure Artifact Signing
        if: steps.signing_config.outputs.signing_mode == 'managed'
        uses: azure/artifact-signing-action@v1
        with:
          endpoint: ${{ vars.WINDOWS_TRUSTED_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.WINDOWS_TRUSTED_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.WINDOWS_TRUSTED_SIGNING_CERT_PROFILE_NAME }}
          files: |
            release-assets/overlay_plugin.dll
            release-assets/overlay-helper.exe
            release-assets/SoulMemoryOverlay-setup.exe
          file-digest: SHA256
          timestamp-rfc3161: ${{ vars.WINDOWS_CODESIGN_TIMESTAMP_URL }}
          timestamp-digest: SHA256

      - name: Verify signed Windows binaries (managed mode)
        if: steps.signing_config.outputs.signing_mode == 'managed'
        timeout-minutes: 15
        shell: pwsh
        run: |
          $releaseContext = "${{ steps.signing_config.outputs.release_context }}" -eq "true"
          $allowSelfSigned = "${{ steps.signing_config.outputs.allow_self_signed }}" -eq "true"

          ./scripts/sign-windows-artifacts.ps1 `
            -Files @(
              "release-assets/overlay_plugin.dll",
              "release-assets/overlay-helper.exe",
              "release-assets/SoulMemoryOverlay-setup.exe"
            ) `
            -ReportPath "release-assets/signing-report.json" `
            -ReleaseContext:$releaseContext `
            -AllowSelfSignedUntrusted:$allowSelfSigned `
            -SkipSigning

      - name: Sign and verify Windows binaries (PFX mode)
        if: steps.signing_config.outputs.signing_mode == 'pfx'
        timeout-minutes: 15
        shell: pwsh
        env:
          WINDOWS_CODESIGN_PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
          WINDOWS_CODESIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PFX_PASSWORD }}
          WINDOWS_CODESIGN_TIMESTAMP_URL: ${{ vars.WINDOWS_CODESIGN_TIMESTAMP_URL }}
        run: |
          $releaseContext = "${{ steps.signing_config.outputs.release_context }}" -eq "true"
          $allowSelfSigned = "${{ steps.signing_config.outputs.allow_self_signed }}" -eq "true"

          Write-Host "Self-signed allowance enabled: $allowSelfSigned"

          ./scripts/sign-windows-artifacts.ps1 `
            -Files @(
              "release-assets/overlay_plugin.dll",
              "release-assets/overlay-helper.exe",
              "release-assets/SoulMemoryOverlay-setup.exe"
            ) `
            -ReportPath "release-assets/signing-report.json" `
            -ReleaseContext:$releaseContext `
            -AllowSelfSignedUntrusted:$allowSelfSigned

      - name: Build archive and SHA256 manifest
        shell: pwsh
        run: |
          $deliverables = @(
            "release-assets/overlay_plugin.dll",
            "release-assets/overlay-helper.exe",
            "release-assets/overlay.toml",
            "release-assets/en-US.ini",
            "release-assets/QUICKSTART.md",
            "release-assets/INSTALL_FIRST.txt",
            "release-assets/SoulMemoryOverlay-setup.exe"
          )

          Compress-Archive -Path $deliverables -DestinationPath "release-assets/SoulMemoryOverlay-windows-x64.zip" -Force
          $deliverables += "release-assets/SoulMemoryOverlay-windows-x64.zip"

          $hashLines = @()
          foreach ($file in $deliverables) {
            if (-not (Test-Path $file)) {
              throw "Expected deliverable missing while computing hashes: $file"
            }
            $hash = (Get-FileHash -Algorithm SHA256 -Path $file).Hash.ToLowerInvariant()
            $hashLines += "$hash *$([IO.Path]::GetFileName($file))"
          }

          $hashLines | Set-Content -Path "release-assets/SHA256SUMS.txt" -Encoding ascii

      - name: Scan release assets with Microsoft Defender
        shell: pwsh
        run: |
          function Resolve-MpCmdRun {
            $platformRoot = "C:/ProgramData/Microsoft/Windows Defender/Platform"
            if (Test-Path $platformRoot) {
              $platformExecutables = Get-ChildItem $platformRoot -Recurse -Filter MpCmdRun.exe -ErrorAction SilentlyContinue |
                Sort-Object FullName -Descending

              $x64Executable = $platformExecutables | Where-Object { $_.FullName -match '[\\/]x64[\\/]MpCmdRun\.exe$' } | Select-Object -First 1
              if ($x64Executable) {
                return $x64Executable.FullName
              }

              $platformExe = $platformExecutables | Select-Object -First 1
              if ($platformExe) {
                return $platformExe.FullName
              }
            }

            $candidatePaths = @(
              (Join-Path $env:ProgramFiles "Windows Defender/MpCmdRun.exe"),
              (Join-Path $env:ProgramFiles "Microsoft Defender/MpCmdRun.exe")
            )

            foreach ($candidate in $candidatePaths) {
              if ($candidate -and (Test-Path $candidate)) {
                return $candidate
              }
            }

            return $null
          }

          $releaseContext = "${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}" -eq "true"
          $scanTargets = @(
            "release-assets/overlay_plugin.dll",
            "release-assets/overlay-helper.exe",
            "release-assets/SoulMemoryOverlay-setup.exe",
            "release-assets/SoulMemoryOverlay-windows-x64.zip"
          )

          $mpCmdRun = Resolve-MpCmdRun
          $hasPreferenceCmd = $null -ne (Get-Command Get-MpPreference -ErrorAction SilentlyContinue)
          $hasThreatCmd = $null -ne (Get-Command Get-MpThreatDetection -ErrorAction SilentlyContinue)
          $hasStatusCmd = $null -ne (Get-Command Get-MpComputerStatus -ErrorAction SilentlyContinue)
          $report = @()

          if (-not $mpCmdRun -or -not $hasThreatCmd -or -not $hasPreferenceCmd -or -not $hasStatusCmd) {
            $missing = @()
            if (-not $mpCmdRun) {
              $missing += "MpCmdRun.exe"
            }
            if (-not $hasThreatCmd) {
              $missing += "Get-MpThreatDetection"
            }
            if (-not $hasPreferenceCmd) {
              $missing += "Get-MpPreference"
            }
            if (-not $hasStatusCmd) {
              $missing += "Get-MpComputerStatus"
            }

            $reason = "Defender tooling unavailable on runner: $($missing -join ', ')"

            $report += [pscustomobject]@{
              asset = "(all)"
              detected = $null
              threat_name = $null
              severity = $null
              scan_exit_code = $null
              scan_status = "unavailable"
              detail = $reason
            }
            $report | ConvertTo-Json -Depth 5 | Out-File -FilePath "release-assets/defender-scan-report.json" -Encoding utf8

            if ($releaseContext) {
              throw $reason
            }

            Write-Warning $reason
            return
          }

          $status = Get-MpComputerStatus -ErrorAction SilentlyContinue
          $preference = Get-MpPreference -ErrorAction SilentlyContinue
          $environmentIssues = @()

          if ($status) {
            if (-not $status.AMServiceEnabled) {
              $environmentIssues += "AM service is disabled"
            }
            if (-not $status.AntivirusEnabled) {
              $environmentIssues += "Antivirus engine is disabled"
            }
            if ($status.RealTimeProtectionEnabled -eq $false) {
              $environmentIssues += "Real-time protection is disabled"
            }
          } else {
            $environmentIssues += "Get-MpComputerStatus did not return status data"
          }

          if ($preference) {
            $excludedRoots = @($preference.ExclusionPath | Where-Object { $_ -is [string] } | ForEach-Object { $_.Trim().ToLowerInvariant() })
            $globalRootExclusions = @($excludedRoots | Where-Object { $_ -match '^[a-z]:\\$' -or $_ -match '^[a-z]:$' })
            if ($globalRootExclusions.Count -gt 0) {
              $environmentIssues += "Full drive exclusions configured: $($globalRootExclusions -join ', ')"
            }
          } else {
            $environmentIssues += "Get-MpPreference did not return preference data"
          }

          if ($environmentIssues.Count -gt 0) {
            $reason = "Defender environment cannot provide meaningful on-demand file scans on this runner. $($environmentIssues -join '; ')"

            $report += [pscustomobject]@{
              asset = "(environment)"
              detected = $null
              threat_name = $null
              severity = $null
              scan_exit_code = $null
              scan_status = "unscannable-environment"
              detail = $reason
            }

            $report | ConvertTo-Json -Depth 5 | Out-File -FilePath "release-assets/defender-scan-report.json" -Encoding utf8

            if ($releaseContext) {
              throw "$reason Use a Windows runner with Defender AV enabled and without full-drive exclusions."
            }

            Write-Warning $reason
            return
          }

          $hasDetection = $false
          $hasScanError = $false
          $hasSkipped = $false

          foreach ($target in $scanTargets) {
            if (-not (Test-Path $target)) {
              throw "Defender scan target missing: $target"
            }

            $resolvedTarget = (Resolve-Path $target).Path
            $scanOutput = & $mpCmdRun -Scan -ScanType 3 -File $resolvedTarget 2>&1
            $scanExit = $LASTEXITCODE
            Start-Sleep -Seconds 2

            $scanDetail = ($scanOutput | Out-String).Trim()
            $wasSkipped = $scanDetail -match '(?i)\bwas\s+skipped\b'

            $threat = Get-MpThreatDetection -ErrorAction SilentlyContinue |
              Where-Object {
                $resources = @($_.Resources | ForEach-Object { $_.ToString() })
                ($resources -join ";") -match [regex]::Escape($resolvedTarget)
              } |
              Sort-Object InitialDetectionTime -Descending |
              Select-Object -First 1

            $detected = $null -ne $threat
            if ($detected) {
              $hasDetection = $true
            }
            if ($wasSkipped) {
              $hasSkipped = $true
            }
            if ($scanExit -ne 0 -and -not $detected) {
              $hasScanError = $true
            }

            $report += [pscustomobject]@{
              asset = $target
              detected = $detected
              threat_name = if ($threat) { $threat.ThreatName } else { $null }
              severity = if ($threat) { $threat.SeverityID } else { $null }
              scan_exit_code = $scanExit
              scan_status = if ($detected) { "detected" } elseif ($wasSkipped) { "skipped" } elseif ($scanExit -eq 0) { "clean" } else { "scan-error" }
              detail = $scanDetail
            }
          }

          $report | ConvertTo-Json -Depth 5 | Out-File -FilePath "release-assets/defender-scan-report.json" -Encoding utf8

          if ($hasDetection) {
            throw "Microsoft Defender detected one or more release assets. See release-assets/defender-scan-report.json"
          }

          if ($hasSkipped) {
            throw "One or more Defender scans were skipped. See release-assets/defender-scan-report.json"
          }

          if ($hasScanError -and $releaseContext) {
            throw "One or more Defender scans failed in release context. See release-assets/defender-scan-report.json"
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: soul-memory-overlay-windows
          path: |
            release-assets/overlay_plugin.dll
            release-assets/overlay-helper.exe
            release-assets/overlay.toml
            release-assets/en-US.ini
            release-assets/QUICKSTART.md
            release-assets/INSTALL_FIRST.txt
            release-assets/SoulMemoryOverlay-setup.exe
            release-assets/SoulMemoryOverlay-windows-x64.zip
            release-assets/SHA256SUMS.txt
            release-assets/signing-report.json
            release-assets/defender-scan-report.json

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: build-windows
    runs-on: windows-latest
    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          name: soul-memory-overlay-windows
          path: dist

      - name: Create GitHub release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/overlay_plugin.dll
            dist/overlay-helper.exe
            dist/overlay.toml
            dist/en-US.ini
            dist/QUICKSTART.md
            dist/INSTALL_FIRST.txt
            dist/SoulMemoryOverlay-setup.exe
            dist/SoulMemoryOverlay-windows-x64.zip
            dist/SHA256SUMS.txt
            dist/signing-report.json
            dist/defender-scan-report.json
