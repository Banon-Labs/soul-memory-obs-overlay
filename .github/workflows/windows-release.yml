name: windows-release

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag name to release (example: v0.1.0)"
        required: true
        type: string
      draft:
        description: "Create as draft release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install OBS Studio build dependency
        shell: pwsh
        run: |
          choco install obs-studio -y

          $obsDll = Get-ChildItem "C:/Program Files/obs-studio" -Recurse -Filter obs.dll -ErrorAction SilentlyContinue | Select-Object -First 1
          $frontendDll = Get-ChildItem "C:/Program Files/obs-studio" -Recurse -Filter obs-frontend-api.dll -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $obsDll -or -not $frontendDll) {
            throw "Could not find OBS runtime DLLs after installation"
          }

          function New-ImportLib {
            param(
              [string]$DllPath,
              [string]$LibName,
              [string]$OutDir
            )
            $defPath = Join-Path $OutDir "$LibName.def"
            $libPath = Join-Path $OutDir "$LibName.lib"

            $dump = & dumpbin /exports $DllPath
            if ($LASTEXITCODE -ne 0) {
              throw "dumpbin failed for $DllPath"
            }

            "LIBRARY $LibName" | Out-File -FilePath $defPath -Encoding ascii
            "EXPORTS" | Out-File -FilePath $defPath -Append -Encoding ascii
            foreach ($line in $dump) {
              if ($line -match '^\s+\d+\s+[0-9A-F]+\s+[0-9A-F]+\s+(\S+)$') {
                $Matches[1] | Out-File -FilePath $defPath -Append -Encoding ascii
              }
            }

            & lib /def:$defPath /out:$libPath /machine:x64
            if ($LASTEXITCODE -ne 0) {
              throw "lib.exe failed generating $libPath"
            }
          }

          $importDir = Join-Path $env:RUNNER_TEMP "obs-import-libs"
          New-Item -ItemType Directory -Path $importDir -Force | Out-Null

          New-ImportLib -DllPath $obsDll.FullName -LibName "obs" -OutDir $importDir
          New-ImportLib -DllPath $frontendDll.FullName -LibName "obs-frontend-api" -OutDir $importDir

          Write-Host "Generated import libs in: $importDir"
          "LIB=$importDir;$env:LIB" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run tests
        if: github.event_name != 'workflow_dispatch'
        run: cargo test

      - name: Build plugin and helper
        run: |
          cargo build -p overlay-plugin --target x86_64-pc-windows-msvc --release
          cargo build -p overlay-helper --target x86_64-pc-windows-msvc --release

      - name: Package installer
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis -y
          }
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            throw "makensis (NSIS) is not available on this runner"
          }
          makensis installer/overlay-installer.nsi

      - name: Prepare release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-assets -Force | Out-Null
          Copy-Item "target/x86_64-pc-windows-msvc/release/overlay_plugin.dll" "release-assets/overlay_plugin.dll" -Force
          Copy-Item "target/x86_64-pc-windows-msvc/release/overlay-helper.exe" "release-assets/overlay-helper.exe" -Force
          Copy-Item "crates/overlay-plugin/data/config/overlay.toml" "release-assets/overlay.toml" -Force
          Copy-Item "crates/overlay-plugin/data/locale/en-US.ini" "release-assets/en-US.ini" -Force
          Copy-Item "QUICKSTART.md" "release-assets/QUICKSTART.md" -Force
          Copy-Item "INSTALL_FIRST.txt" "release-assets/INSTALL_FIRST.txt" -Force
          Copy-Item "SoulMemoryOverlay-0.1.0-setup.exe" "release-assets/SoulMemoryOverlay-setup.exe" -Force
          Compress-Archive -Path "release-assets/*" -DestinationPath "release-assets/SoulMemoryOverlay-windows-x64.zip" -Force

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: soul-memory-overlay-windows
          path: |
            release-assets/overlay_plugin.dll
            release-assets/overlay-helper.exe
            release-assets/overlay.toml
            release-assets/en-US.ini
            release-assets/QUICKSTART.md
            release-assets/INSTALL_FIRST.txt
            release-assets/SoulMemoryOverlay-setup.exe
            release-assets/SoulMemoryOverlay-windows-x64.zip

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: build-windows
    runs-on: windows-latest
    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          name: soul-memory-overlay-windows
          path: dist

      - name: Create GitHub release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/overlay_plugin.dll
            dist/overlay-helper.exe
            dist/overlay.toml
            dist/en-US.ini
            dist/QUICKSTART.md
            dist/INSTALL_FIRST.txt
            dist/SoulMemoryOverlay-setup.exe
            dist/SoulMemoryOverlay-windows-x64.zip
